name: Release Artifact

on:
  workflow_dispatch:
    inputs:
      release_version:
        description: "Package version to verify before artifact handoff"
        required: false
        default: "0.1.0"

permissions:
  contents: read

jobs:
  package-release:
    name: Build auditable release artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Setup Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency graph
        run: npm audit --audit-level=high

      - name: Build CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > release/control-surface-ui.sbom.cdx.json

      - name: Verify requested package version
        run: |
          node -e "const pkg=require('./package.json'); const expected='${{ inputs.release_version }}'; if (pkg.version !== expected) { throw new Error(`package.json version ${pkg.version} does not match workflow input ${expected}`); }"

      - name: Run release smoke
        run: npm run release:smoke

      - name: Generate and verify release provenance
        run: npm run release:provenance && npm run release:provenance:check

      - name: Verify checksum artifacts
        run: npm run checksums -- --check

      - name: Record provenance readiness
        run: |
          node --version
          npm --version
          echo "This workflow grants id-token: write so npm provenance or Sigstore signing can be enabled in the publish pipeline."

      - name: Upload release package and evidence
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: control-surface-ui-${{ inputs.release_version }}-release
          path: |
            release/control-surface-ui-${{ inputs.release_version }}.tgz
            dist/interface-framework.checksums.json
            dist/SHA256SUMS
            docs/release-smoke.md
            docs/release-checklist.md
            docs/release-governance.md
            CHANGELOG.md
            release/control-surface-ui.sbom.cdx.json
            release/provenance.json
            release/provenance.md
          if-no-files-found: error
