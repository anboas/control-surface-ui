name: Framework CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
      - "codex/**"

permissions:
  contents: read

concurrency:
  group: framework-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package-and-contracts:
    name: Package, contracts, and release smoke
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependency graph
        run: npm audit --audit-level=high

      - name: Build CycloneDX SBOM
        run: npm sbom --sbom-format=cyclonedx > release/control-surface-ui.sbom.cdx.json

      - name: Compile themes
        run: npm run theme:compile

      - name: Build distributable assets
        run: npm run build

      - name: Verify checksums
        run: npm run checksums -- --check

      - name: Validate framework contracts
        run: npm run validate

      - name: Smoke package consumers
        run: npm run release:smoke

      - name: Generate and verify release provenance
        run: npm run release:provenance && npm run release:provenance:check

      - name: Upload release smoke artifacts
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-smoke-artifacts
          path: |
            release/*.tgz
            docs/release-smoke.md
            dist/interface-framework.checksums.json
            dist/SHA256SUMS
            release/control-surface-ui.sbom.cdx.json
            release/provenance.json
            release/provenance.md
          if-no-files-found: warn

  browser-baselines:
    name: Browser visual, a11y, and component contracts
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Build distributable assets
        run: npm run build

      - name: Run browser suite
        run: npm run test:browser

      - name: Upload Playwright reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: playwright-reports
          path: |
            test-results/playwright
            test-results/playwright-report
          if-no-files-found: warn
