<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 660 220" role="img" aria-labelledby="title description">
  <title id="title">Native SVG contract fixture</title>
  <desc id="description">Three connected nodes used to verify the interactive diagram viewport.</desc>
  <g fill="none" stroke="#8a99aa" stroke-width="3">
    <path d="M190 110H250" />
    <path d="M410 110H470" />
  </g>
  <g class="node" id="alpha" transform="translate(30 55)">
    <title>Alpha Node</title>
    <rect width="160" height="110" rx="6" fill="#eaf4fb" stroke="#0058a8" stroke-width="3" />
    <text x="80" y="62" text-anchor="middle" font-family="sans-serif" font-size="20">Alpha</text>
  </g>
  <g class="node" id="bravo" transform="translate(250 55)">
    <title>Bravo Node</title>
    <rect width="160" height="110" rx="6" fill="#e8f8f5" stroke="#07738e" stroke-width="3" />
    <text x="80" y="62" text-anchor="middle" font-family="sans-serif" font-size="20">Bravo</text>
  </g>
  <g class="node" id="charlie" transform="translate(470 55)">
    <title>Charlie Node</title>
    <rect width="160" height="110" rx="6" fill="#fff2ec" stroke="#ff7f51" stroke-width="3" />
    <text x="80" y="62" text-anchor="middle" font-family="sans-serif" font-size="20">Charlie</text>
  </g>
</svg>
